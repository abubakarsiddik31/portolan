name: baseline

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bench/baseline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python runner.py --dry-run
