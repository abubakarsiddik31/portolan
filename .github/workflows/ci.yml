name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version || chromium --version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      # The held-out and pilot browser tests are platform-sensitive in their
      # hit-testing; this step covers the core substrate, MCP execution,
      # injection, and perf paths, which are stable on the runner.
      - run: pnpm vitest run packages/substrate/src packages/portolan-server/src bench/security bench/perf
        env:
          PORTOLAN_BROWSER_TESTS: "1"
      - run: pnpm build
      - run: pnpm package:check:tarballs
      - run: pnpm release:dry-run --out /tmp/portolan-release
      - run: pnpm docs:build --out /tmp/portolan-docs
      - run: pnpm licenses:check
